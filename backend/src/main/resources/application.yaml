spring:
  application:
    name: backend
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB


azure:
  storage:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING}
    blob-container-name: ${AZURE_STORAGE_CONTAINER}


app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
